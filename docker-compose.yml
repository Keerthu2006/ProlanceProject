version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trigrowth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       trigrowth_ai
      POSTGRES_USER:     trigrowth
      POSTGRES_PASSWORD: trigrowth123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trigrowth -d trigrowth_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB browser) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trigrowth_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@tea.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
